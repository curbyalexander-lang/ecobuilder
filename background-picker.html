<script>// Turns a cut-out photo into a flat, outlined illustration, keeping every shape from the photo.
// ILLUS.render(imageOrCanvas, { detail: 'simple' | 'medium' | 'detailed', outline: true }) -> canvas
(function () {
  var I = window.ILLUS = {};
  var LEVELS = {
    simple:   { radius: 5, passes: 2, colors: 6,  modePasses: 2, minArea: 160, inner: 70 },
    medium:   { radius: 4, passes: 2, colors: 9,  modePasses: 1, minArea: 70,  inner: 55 },
    detailed: { radius: 3, passes: 1, colors: 14, modePasses: 1, minArea: 25,  inner: 45 }
  };

  I.render = function (src, opts) {
    opts = opts || {};
    var L = LEVELS[opts.detail] || LEVELS.medium, outline = opts.outline !== false;
    // silhouette: the bold line round the outside (off for backgrounds, which have no outside)
    var sil = outline && opts.silhouette !== false;
    var W = src.naturalWidth || src.width, H = src.naturalHeight || src.height;
    var c0 = document.createElement('canvas'); c0.width = W; c0.height = H;
    var x0 = c0.getContext('2d'); x0.drawImage(src, 0, 0, W, H);
    var d = x0.getImageData(0, 0, W, H).data, N = W * H;

    // 1. Smooth away grain and fur while keeping edges (Kuwahara filter, weighted by alpha)
    var alpha = new Uint8Array(N), sm = new Float32Array(N * 3);
    for (var i = 0; i < N; i++) { alpha[i] = d[i * 4 + 3]; sm[i * 3] = d[i * 4]; sm[i * 3 + 1] = d[i * 4 + 1]; sm[i * 3 + 2] = d[i * 4 + 2]; }
    for (var kp = 0; kp < L.passes; kp++) sm = kuwahara(sm, alpha, W, H, L.radius);
    var x, y, k;

    // 2. A small set of flat colours (k-means on the organism's own pixels), a little richer than the photo
    var K = L.colors, samp = [], step = Math.max(1, Math.floor(N / 6000));
    for (i = 0; i < N; i += step) if (alpha[i] >= 128) samp.push(i);
    if (!samp.length) return c0;
    samp.sort(function (a, b) { return lum(sm, a) - lum(sm, b); });
    var cen = [];
    for (k = 0; k < K; k++) { var s0 = samp[Math.floor((k + 0.5) / K * samp.length)]; cen.push([sm[s0 * 3], sm[s0 * 3 + 1], sm[s0 * 3 + 2]]); }
    for (var it = 0; it < 8; it++) {
      var acc = cen.map(function () { return [0, 0, 0, 0]; });
      samp.forEach(function (s) { var j = nearest(cen, sm[s * 3], sm[s * 3 + 1], sm[s * 3 + 2]), A = acc[j]; A[0] += sm[s * 3]; A[1] += sm[s * 3 + 1]; A[2] += sm[s * 3 + 2]; A[3]++; });
      cen = cen.map(function (c, j) { var A = acc[j]; return A[3] ? [A[0] / A[3], A[1] / A[3], A[2] / A[3]] : c; });
    }
    cen = cen.map(function (c) { var m = (c[0] + c[1] + c[2]) / 3; return c.map(function (v) { return clamp(m + (v - m) * 1.18); }); });
    var lab = new Int16Array(N).fill(-1);
    for (i = 0; i < N; i++) if (alpha[i] >= 128) lab[i] = nearest(cen, sm[i * 3], sm[i * 3 + 1], sm[i * 3 + 2]);

    // 3. Tidy speckles: each pixel takes the most common colour around it
    for (var pass = 0; pass < L.modePasses; pass++) {
      var nl = new Int16Array(lab), cnt = new Int16Array(K);
      for (y = 1; y < H - 1; y++) for (x = 1; x < W - 1; x++) {
        i = y * W + x; if (lab[i] < 0) continue;
        cnt.fill(0); var top = lab[i], tc = 0;
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) { var n = lab[i + dy * W + dx]; if (n >= 0 && ++cnt[n] > tc) { tc = cnt[n]; top = n; } }
        nl[i] = top;
      }
      lab = nl;
    }

    mergeSmall(lab, W, H, K, L.minArea);

    // 4. Paint, with fine lines where very different colours meet and a bold line round the outside
    var pad = sil ? 3 : 0, OW = W + pad * 2, OH = H + pad * 2;
    var out = document.createElement('canvas'); out.width = OW; out.height = OH;
    var ox = out.getContext('2d'), od = ox.createImageData(OW, OH), o = od.data;
    var darkest = cen.reduce(function (a, c) { return c[0] + c[1] + c[2] < a[0] + a[1] + a[2] ? c : a; });
    var ink = [darkest[0] * 0.45, darkest[1] * 0.45, darkest[2] * 0.45].map(Math.round);
    function dist(a, b) { var A = cen[a], B = cen[b]; return Math.sqrt((A[0] - B[0]) * (A[0] - B[0]) + (A[1] - B[1]) * (A[1] - B[1]) + (A[2] - B[2]) * (A[2] - B[2])); }
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      i = y * W + x; var lb = lab[i]; if (lb < 0) continue;
      var c = cen[lb], col = c, edge = false;
      if (outline) {
        var rn = x + 1 < W ? lab[i + 1] : -1, dn = y + 1 < H ? lab[i + W] : -1;

      }
      if (edge) col = [c[0] * 0.4, c[1] * 0.4, c[2] * 0.4];
      var op = ((y + pad) * OW + x + pad) * 4;
      o[op] = col[0]; o[op + 1] = col[1]; o[op + 2] = col[2]; o[op + 3] = 255;
    }
    if (sil) {
      // outline: every empty pixel within `pad` of the organism
      var solid = new Uint8Array(OW * OH);
      for (y = 0; y < H; y++) for (x = 0; x < W; x++) if (lab[y * W + x] >= 0) solid[(y + pad) * OW + x + pad] = 1;
      for (y = 0; y < OH; y++) for (x = 0; x < OW; x++) {
        var j2 = y * OW + x; if (solid[j2]) continue;
        var near = false;
        for (dy = -pad; dy <= pad && !near; dy++) for (dx = -pad; dx <= pad; dx++) {
          if (dx * dx + dy * dy > pad * pad + 1) continue;
          var yy = y + dy, xx = x + dx;
          if (yy >= 0 && yy < OH && xx >= 0 && xx < OW && solid[yy * OW + xx]) { near = true; break; }
        }
        if (near) { o[j2 * 4] = ink[0]; o[j2 * 4 + 1] = ink[1]; o[j2 * 4 + 2] = ink[2]; o[j2 * 4 + 3] = 255; }
      }
    }
    ox.putImageData(od, 0, 0);
    return out;
  };
  function kuwahara(src, alpha, W, H, R) {
    var S = (W + 1) * (H + 1), sA = new Float64Array(S), sR = new Float64Array(S), sG = new Float64Array(S), sB = new Float64Array(S), sL = new Float64Array(S), sL2 = new Float64Array(S);
    for (var y = 0; y < H; y++) {
      var rA = 0, rR = 0, rG = 0, rB = 0, rL = 0, rL2 = 0;
      for (var x = 0; x < W; x++) {
        var i = y * W + x, a = alpha[i] / 255, r = src[i * 3], g = src[i * 3 + 1], b = src[i * 3 + 2], l = 0.299 * r + 0.587 * g + 0.114 * b;
        rA += a; rR += a * r; rG += a * g; rB += a * b; rL += a * l; rL2 += a * l * l;
        var q = (y + 1) * (W + 1) + x + 1, u = q - (W + 1);
        sA[q] = sA[u] + rA; sR[q] = sR[u] + rR; sG[q] = sG[u] + rG; sB[q] = sB[u] + rB; sL[q] = sL[u] + rL; sL2[q] = sL2[u] + rL2;
      }
    }
    function box(arr, xa, ya, xb, yb) { var w = W + 1; return arr[(yb + 1) * w + xb + 1] - arr[ya * w + xb + 1] - arr[(yb + 1) * w + xa] + arr[ya * w + xa]; }
    var out = new Float32Array(src.length);
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      var j = y * W + x; if (alpha[j] < 8) continue;
      var best = Infinity, br = 0, bg = 0, bb = 0;
      for (var k = 0; k < 4; k++) {
        var xa = k & 1 ? x : Math.max(0, x - R), xb = k & 1 ? Math.min(W - 1, x + R) : x;
        var ya = k & 2 ? y : Math.max(0, y - R), yb = k & 2 ? Math.min(H - 1, y + R) : y;
        var wa = box(sA, xa, ya, xb, yb); if (wa < 1) continue;
        var ml = box(sL, xa, ya, xb, yb) / wa, v = box(sL2, xa, ya, xb, yb) / wa - ml * ml;
        if (v < best) { best = v; br = box(sR, xa, ya, xb, yb) / wa; bg = box(sG, xa, ya, xb, yb) / wa; bb = box(sB, xa, ya, xb, yb) / wa; }
      }
      out[j * 3] = br; out[j * 3 + 1] = bg; out[j * 3 + 2] = bb;
    }
    return out;
  }
  // Merge patches smaller than minArea into the neighbouring colour they touch most
  function mergeSmall(lab, W, H, K, minArea) {
    var N = W * H, comp = new Int32Array(N).fill(-1), stack = new Int32Array(N), nc = 0;
    for (var s = 0; s < N; s++) {
      if (lab[s] < 0 || comp[s] >= 0) continue;
      var L0 = lab[s], top = 0, members = [s], touch = new Int32Array(K); comp[s] = nc; stack[top++] = s;
      while (top) {
        var i = stack[--top], x = i % W, y = (i / W) | 0;
        var nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < H - 1 ? i + W : -1];
        for (var t = 0; t < 4; t++) {
          var n = nb[t]; if (n < 0 || lab[n] < 0) continue;
          if (lab[n] === L0) { if (comp[n] < 0) { comp[n] = nc; stack[top++] = n; members.push(n); } }
          else touch[lab[n]]++;
        }
      }
      if (members.length < minArea) {
        var bi = -1, bc = 0; for (var k = 0; k < K; k++) if (touch[k] > bc) { bc = touch[k]; bi = k; }
        if (bi >= 0) for (var m = 0; m < members.length; m++) lab[members[m]] = bi;
      }

  function lum(a, i) { return 0.299 * a[i * 3] + 0.587 * a[i * 3 + 1] + 0.114 * a[i * 3 + 2]; }
  function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
  function nearest(cen, r, g, b) {
    var bi = 0, bd = Infinity;
    for (var k = 0; k < cen.length; k++) { var c = cen[k], dd = (c[0] - r) * (c[0] - r) + (c[1] - g) * (c[1] - g) + (c[2] - b) * (c[2] - b); if (dd < bd) { bd = dd; bi = k; } }
    return bi;
  }
  // Promise version from a data URL; resolves with a data URL (WebP where supported)
  I.fromURL = function (url, opts) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        var c = I.render(img, opts), w = c.toDataURL('image/webp', 0.9);

      };
      img.onerror = rej; img.src = url;
    });
  };
})();</script>

  :root { --ink: #1b2620; --muted: #5d6a62; --line: #dfe3dc; --paper: #f7f6f1; --card: #fff; --forest: #1e3a2c; --accent: #2e7d4f; --gold: #f2c14e; }

  h2 { margin: 0 0 4px; font-size: 22px; }

  .line.hz { border-top-color: var(--gold); }
  #ln-top i { top: 6px; }

  .pc img { width: 100%; height: 70px; object-fit: cover; display: block; }
  .pcb { padding: 6px 8px; display: grid; gap: 4px; font-size: 12px; }
  .pcb label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .pcb input[type=range] { flex: 1; min-width: 0; }
  .pcact { display: flex; gap: 4px; }
  .pcact button { padding: 2px 8px; font-size: 12px; }
  .pcadd { width: 160px; border: 2px dashed #b9c4b5; background: #fbfcf9; color: var(--accent); font-weight: 650; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .row label { display: flex; align-items: center; gap: 8px; }
  .swatches { display: flex; gap: 6px; }
  .swatches button { width: 34px; height: 34px; padding: 0; border-radius: 8px; }
  .swatches button[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
  #pv { width: 100%; border-radius: 10px; display: block; cursor: grab; background: #ccc; }
  #pv:active { cursor: grabbing; }
  .credit { font-size: 12.5px; color: var(--muted); }
  .credit a { color: var(--accent); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1e2a20; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: 90vw; }
  #toast.on { opacity: 1; }
  .busy { color: var(--muted); font-style: italic; }
  details.help { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 12px; }
  details.help summary { cursor: pointer; font-weight: 650; }
  details.help li { line-height: 1.5; max-width: 760px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } #side { max-height: 34vh; } body { overflow: auto; } }
</style>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };

    { key: 'wetland', name: 'Wetland / pond', q: 'marsh wetland panorama', ph: ['lake', 'river', 'water'], sky: ['#5d98cc', '#e2ede7'], ground: '#6f8a4a' },
    { key: 'plain', name: 'Blank meadow', q: 'meadow panorama', ph: ['meadow', 'field'], sky: ['#5a9be0', '#e8f0f6'], ground: '#7fa152' },
    { key: 'yellowstone', name: 'Yellowstone', park: 1, q: 'Yellowstone National Park panorama', sky: ['#4f92d6', '#dcecf6'], ground: '#9a9a6a' },
    { key: 'grandteton', name: 'Grand Teton', park: 1, q: 'Teton Range panorama', sky: ['#3f86d4', '#e2eef6'], ground: '#8e9670' },

    $('#sh-t').style.top = 0; $('#sh-t').style.height = (P.top * 100) + '%';

      function mv(ev) {

  // Draw one photo's scenery into a strip `width` wide, centred, repeating it (every other copy mirrored) if it is too narrow
  function paintPiece(x, P, x0, width, bh, extL) {
    var S = P.src, sy = Math.round(P.top * S.height), sh = Math.max(4, Math.round((P.hz - P.top) * S.height)), sw = S.width;

  // Build the band: the scenery from the top line to the horizon, wrapped round the full circle

    var x = c.getContext('2d'); x.imageSmoothingQuality = 'high';

  function drawSwatches() {

    $('#sw').onclick = function (e) { var b = e.target.closest('[data-c]'); if (!b) return; ed.ground = b.dataset.c; $('#gc').value = ed.ground; drawSwatches(); drawPreview(); };

  function rebuild(quick) {

    clearTimeout(rebuild.t);

      if (!ed) return;

  }

  }
  // The preview: a 100° slice of the view, as if standing in the scene
  function drawPreview() {

    var g = x.createLinearGradient(0, 0, 0, hy); g.addColorStop(0, ed.sky[0]); g.addColorStop(1, ed.sky[1]);

    cv.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, yaw: ed.yaw }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', function (e) { if (!drag) return; var r = cv.getBoundingClientRect(); ed.yaw = drag.yaw - (e.clientX - drag.x) / r.width * 100; drawPreview(); });
    cv.addEventListener('pointerup', function () { drag = null; });
  }

  function save() {
    var s = SETTINGS[cur], band = ed.band, tot = ed.pieces.reduce(function (a, q) { return a + q.share; }, 0);
    var photo = webp(band), th = document.createElement('canvas'); th.width = 360; th.height = 120;
    var tx = th.getContext('2d'), g = tx.createLinearGradient(0, 0, 0, 72); g.addColorStop(0, ed.sky[0]); g.addColorStop(1, ed.sky[1]);

    store(s.key, { key: s.key, name: s.name, photo: photo, thumb: th.toDataURL('image/jpeg', 0.8), heightDeg: ed.height, tiles: ed.tiles, full360: ed.full360,
      pieces: ed.pieces.map(function (q) { return { top: q.top, horizon: q.hz, deg: Math.round(q.share / tot * 360) }; }),

    ed = null; adding = false; renderSide();

  // ---------- download / open (.zip, stored) ----------
