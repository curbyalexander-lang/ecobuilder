<script>// CUTOUT: turns an uploaded photo or drawing into a cut-out with a transparent background.
// 1) Plain backgrounds (a drawing on paper) are removed instantly by color.
// 2) Busy backgrounds use a small AI model (U-2-Net-p, Apache-2.0) that runs in the browser.
// 3) Students can touch up the result with Erase / Bring back brushes before saving.
(function () {
  var C = window.CUTOUT = {};

    ortScript: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js',

      ort.env.wasm.wasmPaths = C.config.ortWasm;
      ort.env.wasm.numThreads = 1;
      return fetchModel(C.config.models);
    }).then(function (buf) {
      return ort.InferenceSession.create(new Uint8Array(buf), { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    });

  };

  // Returns a Uint8Array mask (0 = background, 255 = keep) for a canvas
  C.aiMask = function (canvas) {
    return C.session().then(function (session) {
      var S = 320, t = document.createElement('canvas'); t.width = t.height = S;
      var tx = t.getContext('2d'); tx.drawImage(canvas, 0, 0, S, S);
      var px = tx.getImageData(0, 0, S, S).data, n = S * S, max = 1;
      for (var i = 0; i < px.length; i += 4) { if (px[i] > max) max = px[i]; if (px[i + 1] > max) max = px[i + 1]; if (px[i + 2] > max) max = px[i + 2]; }

        for (var a = 0, b = 0; a < mask.length; a++, b += 4) {

  };
  C.colorMask = function (canvas, tol) {
    tol = tol || 70;
    var W = canvas.width, H = canvas.height, d = canvas.getContext('2d').getImageData(0, 0, W, H).data;

    function isBg(i) {

    if (b.plain >= 0.85) return Promise.resolve({ mask: C.colorMask(canvas), method: 'color' });

  };

    x0 = Math.max(0, x0 - 2); y0 = Math.max(0, y0 - 2); x1 = Math.min(W - 1, x1 + 2); y1 = Math.min(H - 1, y1 + 2);

  }

<body>
<header>
  <a href="index.html">🌿 EcoBuild</a>
  <h1>Picture Picker</h1>
  <div class="prog"><div class="bar"><i id="bar"></i></div><span id="count"></span></div>
  <span class="sp"></span>
  <label class="sty">Style <select id="s-style"><option value="illus">Illustration</option><option value="photo">Photo</option></select></label>
  <label class="sty" id="l-detail">Detail <select id="s-detail"><option value="simple">Simple</option><option value="medium">Medium</option><option value="detailed">Detailed</option></select></label>
  <label class="sty" id="l-outline"><input type="checkbox" id="s-outline" checked> Outlines</label>
  <button id="b-load" title="Continue on this computer from a pictures file you downloaded before">Open saved pictures…</button>
  <button id="b-down" class="gold">Download pictures</button>
  <input type="file" id="f-load" accept=".zip" hidden>
  <input type="file" id="f-own" accept="image/*" hidden>
</header>
<main>
  <section id="side">
    <div id="filters">
      <input type="search" id="q" placeholder="Find an item">
      <div class="row">
        <select id="f-status" aria-label="Show"><option value="todo">To do</option><option value="all">All items</option><option value="done">Done</option><option value="skip">Kept as is</option></select>
        <select id="f-cat" aria-label="Category"><option value="">All kinds</option></select>
      </div>
    </div>
    <div id="list"></div>
  </section>
  <section id="work"></section>
</main>
<div id="toast"></div>
<script>
(function () {
  var EL = window.ECOLIB, $ = function (s) { return document.querySelector(s); };

  var HINT = {
    'Deciduous tree': ['Quercus alba'], 'Evergreen tree': ['Picea pungens'], 'Palm tree': ['Sabal palmetto'], 'Cactus': ['Carnegiea gigantea'], 'Bamboo': ['Phyllostachys'],
    'Grass': ['Poaceae'], 'Fern': ['Polystichum acrostichoides'], 'Clover': ['Trifolium repens'], 'Sunflower': ['Helianthus annuus'], 'Wildflower': ['Rudbeckia hirta'],
    'Blossom': ['Prunus serrulata'], 'Hibiscus': ['Hibiscus rosa-sinensis'], 'Tulip': ['Tulipa'], 'Hyacinth': ['Hyacinthus orientalis'], 'Lotus': ['Nelumbo nucifera'], 'Corn': ['Zea mays'],
    'Deer': ['Odocoileus virginianus'], 'Bear': ['Ursus arctos'], 'Wolf': ['Canis lupus'], 'Fox': ['Vulpes vulpes'], 'Rabbit': ['Sylvilagus floridanus'], 'Squirrel': ['Sciurus carolinensis'],

    'Giraffe': ['Giraffa'], 'Elephant': ['Loxodonta africana'], 'Rhinoceros': ['Ceratotherium simum'], 'Hippopotamus': ['Hippopotamus amphibius'], 'Kangaroo': ['Osphranter rufus'],
    'Monkey': ['Ateles geoffroyi'], 'Gorilla': ['Gorilla gorilla'], 'Sloth': ['Bradypus variegatus'], 'Polar bear': ['Ursus maritimus'], 'Penguin': ['Aptenodytes forsteri'], 'Seal': ['Phoca vitulina'],
    'Owl': ['Bubo virginianus'], 'Eagle': ['Haliaeetus leucocephalus'], 'Songbird': ['Sialia sialis'], 'Parrot': ['Ara macao'], 'Duck': ['Anas platyrhynchos'], 'Swan': ['Cygnus olor'],
    'Flamingo': ['Phoenicopterus ruber'], 'Bat': ['Tadarida brasiliensis'], 'Frog': ['Lithobates catesbeianus', [1, 2]], 'Snake': ['Thamnophis sirtalis'], 'Lizard': ['Sceloporus undulatus'],
    'Turtle': ['Trachemys scripta'], 'Alligator': ['Alligator mississippiensis'], 'Bee': ['Apis mellifera'], 'Butterfly': ['Danaus plexippus', [1, 2]], 'Caterpillar': ['Danaus plexippus', [1, 6]],

    'Squid': ['Sepioteuthis lessoniana'], 'Jellyfish': ['Aurelia aurita'], 'Crab': ['Callinectes sapidus'], 'Lobster': ['Homarus americanus'], 'Shrimp': ['Lysmata amboinensis'],

    'Frog eggs': ['Anura', [1, 7]], 'Butterfly egg': ['Danaus plexippus', [1, 7]], 'Tadpole': ['Anura', [1, 6]], 'Tadpole with legs': ['Anura', [1, 6]], 'Froglet': ['Anura', [1, 8]],
    'Chrysalis': ['Danaus plexippus', [1, 4]], 'Larva (grub)': ['Scarabaeidae', [1, 6]], 'Pupa': ['Coleoptera', [1, 4]], 'Chick': ['Gallus gallus', [1, 8]], 'Hen': ['Gallus gallus', [1, 2]],
    'Rooster': ['Gallus gallus', [1, 2]], 'Acorn': ['Quercus', [12, 14]], 'Nest with eggs': ['Turdus migratorius', [1, 7]]
  };
  // Not living things (or not photographed on iNaturalist): upload a picture instead
  var NOT_INAT = { 'Rock': 1, 'Log': 1, 'Water source': 1, 'Sunlight': 1, 'Nest': 1, 'Egg': 1, 'Hatching chick': 1, 'Seed': 1, 'Sprouting seed': 1, 'Fruit': 1, 'Seedling': 1, 'Bacteria': 1 };
  var SUCAT = { plants: 'Plants', mammals: 'Mammals', birds: 'Birds', reptiles: 'Reptiles & amphibians', small: 'Insects & small animals', water: 'Water life' };

  var items = [], byKey = {};
  function add(n) { var k = n.toLowerCase(); if (!byKey[k]) { byKey[k] = { name: n, slug: slug(n), sci: '', cat: '', where: [], thumb: null }; items.push(byKey[k]); } return byKey[k]; }
  function thumbFor(spec) {
    if (!spec) return null;
    if (spec.svg) return { img: EL.svgUrl(spec.svg) };
    if (spec.e) return { e: spec.e };
    return null;
  }
  EL.LIB.forEach(function (i) {
    var r = add(i.n); r.cat = r.cat || CATNAME[i.c];
    r.where.push(i.c === 'stage' ? 'Life stages library' : 'Main library');
    r.thumb = r.thumb || thumbFor(i);
  });
  var natPlaces = {};
  Object.keys(EL.NATIVE).forEach(function (place) {
    EL.nativeFor(place).forEach(function (i) {
      var r = add(i.n); r.sci = r.sci || i.sci; r.cat = r.cat || CATNAME[i.c];
      (natPlaces[r.name.toLowerCase()] = natPlaces[r.name.toLowerCase()] || []).push(PLACES[place] || place);
      r.thumb = r.thumb || thumbFor(i);
    });
  });
  Object.keys(natPlaces).forEach(function (k) { byKey[k].where.push('Native: ' + natPlaces[k].join(', ')); });
  (window.SU_DATA || []).forEach(function (o) {
    var r = add(o.n); r.sci = r.sci || o.sci; r.cat = r.cat || CATNAME[o.c];
    r.where.push('Size Up: ' + SUCAT[o.c]);
    if (!r.thumb && o.art) {
      var a = o.art;
      if (a.indexOf('e:') === 0) r.thumb = { e: a.slice(2) };
      else if (a.indexOf('su:') === 0 && window.SU_ART && SU_ART[a.slice(3)]) r.thumb = { img: EL.svgUrl(SU_ART[a.slice(3)]) };

  items.sort(function (a, b) { return (ORDER.indexOf(a.cat) - ORDER.indexOf(b.cat)) || a.name.localeCompare(b.name); });
  items.forEach(function (r) {
    var h = HINT[r.name];
    r.query = h ? h[0] : (r.sci || r.name);
    r.stage = h && h[1] ? h[1] : null;
    r.noInat = !!NOT_INAT[r.name];
  });
  ORDER.forEach(function (c) { $('#f-cat').insertAdjacentHTML('beforeend', '<option value="' + c + '">' + c + '</option>'); });

  // ---------- 2. saved picks, kept in this browser (IndexedDB) ----------
  var picks = {}, db = null;
  function openDB() {
    return new Promise(function (res) {
      try {
        var rq = indexedDB.open('ecobuild-picker', 1);

        rq.onerror = function () { res(); };

    return new Promise(function (res) {
      if (!db) return res();

    if (!db) return;

  function showStyleCtl() { $('#l-detail').style.display = $('#l-outline').style.display = STY.style === 'illus' ? '' : 'none'; }
  showStyleCtl();
  ['#s-style', '#s-detail', '#s-outline'].forEach(function (id) {

  function visible() {

  // ---------- 4. iNaturalist ----------
  var API = 'https://api.inaturalist.org/v1/';
  // Photos we may use: open licences that allow changes (no "no derivatives"). NC = non-commercial use only.
  var OK = { 'cc0': 'CC0', 'cc-by': 'CC BY', 'cc-by-sa': 'CC BY-SA', 'cc-by-nc': 'CC BY-NC', 'cc-by-nc-sa': 'CC BY-NC-SA' };
  var cache = {};
  function getJSON(url) {

    return (cache[url] = fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

  function size(url, s) { return String(url || '').replace(/\/(square|small|medium|large|thumb|original)\.(jpe?g|png|gif)/i, '/' + s + '.$2'); }
  function photoObj(p, extra) {

    if (!OK[lc] || !p.url) return null;
    return { id: p.id, thumb: size(p.url, 'medium'), big: size(p.url, 'large'), license: OK[lc], attribution: p.attribution || '',
      page: 'https://www.inaturalist.org/photos/' + p.id, obs: extra && extra.obs ? 'https://www.inaturalist.org/observations/' + extra.obs : '', who: extra && extra.who || '' };
  }

  var view = null; // { r, taxa, taxon, photos, page, seen }
  function show(i) {
    cur = Math.max(0, Math.min(items.length - 1, i));
    var r = items[cur];
    try { localStorage.setItem('ecobuild-picker-cur', r.slug); } catch (e) {}
    view = { r: r, taxa: [], taxon: null, photos: [], page: 0, seen: {}, query: r.query };
    renderList(); renderWork();
    if (!r.noInat) search(r.query);
  }
  function renderWork() {
    var r = view.r, p = picks[r.slug], s = status(r);
    var curPic = r.thumb && r.thumb.img ? '<img alt="" src="' + r.thumb.img + '">' : (r.thumb && r.thumb.e) || '';
    var html = '<div class="top"><div class="now"><div><div class="pic">' + curPic + '</div><div class="lab">Now</div></div>' +
      (p && p.status === 'done' ? '<div><div class="pic' + (STY.style === 'photo' ? ' chosen' : '') + '"><img alt="" src="' + p.url + '"></div><div class="lab">Photo</div></div>' +
        '<div><div class="pic' + (STY.style === 'illus' ? ' chosen' : '') + '"><img alt="" src="' + p.url + '" data-ill="' + r.slug + '" data-force="1"></div><div class="lab">Illustration</div></div>' : '') +
      '<div><h2>' + esc(r.name) + '</h2>' + (r.sci ? '<div class="sci">' + esc(r.sci) + '</div>' : '') +
      '<div class="where">' + esc(r.cat) + ' · ' + esc(r.where.join(' · ')) + '</div>' +
      '<div class="file">pictures/' + esc(r.slug) + (p && p.status === 'done' ? (p.url.indexOf('image/png') > 0 ? '.png' : '.webp') : '.webp') + '</div></div></div>' +
      '<div class="acts"><button id="b-prev">‹ Back</button><button id="b-own">Upload my own picture</button>' +
      '<button id="b-skip">' + (s === 'skip' ? 'Kept as is ✓' : 'Keep current picture') + '</button>' +
      (s !== 'todo' ? '<button id="b-undo" class="danger">Start over</button>' : '') + '<button id="b-next" class="primary">Next ›</button></div></div>';
    if (p && p.status === 'done') html += '<div class="note ok"><b>Done.</b> <span class="credit">' + creditHTML(p.credit) + '</span><br>' +
      'The picture outlined in gold is the style that will be downloaded. Change it with <b>Style</b> at the top: it applies to every picture. Pick another photo below to replace this one.</div>';
    if (r.noInat) html += '<div class="note">iNaturalist only has photos of wild living things, so there is nothing to look up for <b>' + esc(r.name) + '</b>. Use <b>Upload my own picture</b> (a photo you took, or one with a licence that allows reuse), or keep the current picture.</div>';
    else html += '<div class="search"><input type="text" id="sq" value="' + esc(view.query) + '" aria-label="Look up on iNaturalist"><button id="b-sq">Look up</button></div>' +
      '<div class="taxa" id="taxa"></div><div class="grid" id="grid"><p class="muted">Looking up photos…</p></div><div class="more" id="more"></div>';
    html += '<details class="help"><summary>How this works</summary><ol>' +
      '<li>Pick a clear side view of the whole organism. The background is removed next, and you can clean it up with Erase and Bring back.</li>' +
      '<li>Press <b>Done</b> in the clean-up window. The picture is saved in this browser and the next item opens.</li>' +
      '<li>Only photos whose licences allow reuse with changes are shown. Each photographer is recorded for the credits page. ' +
      '“NC” licences mean non-commercial use only, which fits a free classroom site.</li>' +
      '<li>Your picks stay in this browser on this computer. Press <b>Download pictures</b> any time to get a .zip of everything so far, ' +
      'and use <b>Open saved pictures…</b> to pick up where you left off on another computer.</li>' +
      '<li><b>Style</b> at the top turns every saved photo into a flat, outlined illustration (or keeps it a photo). It changes all the pictures at once, ' +
      'so they match. The original photos are kept, so you can change the style any time, even after downloading.</li>' +
      '<li>Life stages (eggs, tadpoles, chrysalis) are looked up with iNaturalist\'s life-stage labels, so the photos should already show that stage.</li></ol></details>';
    $('#work').innerHTML = html; $('#work').scrollTop = 0;
    // the before/after preview always shows the illustration, whichever style is chosen
    var fi = $('#work img[data-force]');
    if (fi) illus(r.slug).then(function (u) { if (u && fi.isConnected) fi.src = u; });
    $('#b-prev').onclick = function () { step(-1); };
    $('#b-next').onclick = function () { step(1); };
    $('#b-own').onclick = function () { $('#f-own').click(); };
    $('#b-skip').onclick = function () { if (s === 'skip') return; savePick(r.slug, { status: 'skip' }); toast('Keeping the current picture for ' + r.name + '.'); step(1); };
    if ($('#b-undo')) $('#b-undo').onclick = function () { savePick(r.slug, null); renderList(); renderWork(); if (!r.noInat) search(view.query); };
    if ($('#b-sq')) {
      $('#b-sq').onclick = function () { search($('#sq').value.trim()); };
      $('#sq').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(this.value.trim()); });
    }
    if (view.taxa.length) { renderTaxa(); renderPhotos(); }
  }
  function step(d) {
    var v = visible(), i = v.indexOf(items[cur]), n = v[i + d];
    if (d > 0 && $('#f-status').value === 'todo') {
      // jump to the next item still to do
      for (var k = cur + 1; k < items.length; k++) if (status(items[k]) === 'todo') { n = items[k]; break; }
    }
    if (n) show(items.indexOf(n)); else toast(d > 0 ? 'That was the last one in this list.' : 'This is the first one.');
  }
  function creditHTML(c) {
    if (!c) return '';
    if (c.source === 'upload') return 'Your own picture' + (c.attribution ? ' · ' + esc(c.attribution) : '') + '.';
    var at = c.attribution || ('by ' + c.who);
    return 'Photo ' + esc(at) + (c.license && at.indexOf(c.license) < 0 ? ' (' + esc(c.license) + ')' : '') + ' · <a target="_blank" rel="noopener" href="' + esc(c.page) + '">iNaturalist</a>';
  }

  function search(q) {
    if (!q) return;
    view.query = q; view.taxa = []; view.taxon = null; view.photos = []; view.page = 0; view.seen = {};
    var g = $('#grid'); if (g) g.innerHTML = '<p class="muted">Looking up photos…</p>';
    var mine = view;
    getJSON(API + 'taxa/autocomplete?per_page=8&q=' + encodeURIComponent(q)).then(function (d) {
      if (mine !== view) return;
      var res = (d.results || []).filter(function (t) { return t.id; });
      if (!res.length) { $('#grid').innerHTML = '<p class="muted">iNaturalist found nothing for “' + esc(q) + '”. Try the scientific name, a simpler common name, or upload your own picture.</p>'; $('#taxa').innerHTML = ''; return; }
      var ql = q.toLowerCase(), best = res.filter(function (t) { return (t.name || '').toLowerCase() === ql || (t.preferred_common_name || '').toLowerCase() === ql; })[0] || res[0];
      view.taxa = res; pickTaxon(best);
    }).catch(offline);
  }
  function offline() {
    var g = $('#grid'); if (!g) return;
    g.innerHTML = '<p class="muted">Could not reach iNaturalist. Check the internet connection and press Look up again. ' +
      'If this keeps happening, use <b>Upload my own picture</b> for now.</p>';
  }
  function renderTaxa() {
    $('#taxa').innerHTML = view.taxa.map(function (t, k) {
      return '<button data-k="' + k + '" aria-pressed="' + (view.taxon && t.id === view.taxon.id) + '">' + esc(t.preferred_common_name || t.name) +
        ' <i>' + esc(t.preferred_common_name ? t.name : t.rank) + '</i></button>';
    }).join('') + '<span class="muted small" style="align-self:center;font-size:12px">Not the right one? Pick another match.</span>';
    $('#taxa').onclick = function (e) { var b = e.target.closest('[data-k]'); if (b) pickTaxon(view.taxa[+b.dataset.k]); };
  }
  function pickTaxon(t) {
    view.taxon = t; view.photos = []; view.page = 0; view.seen = {};
    renderTaxa(); $('#grid').innerHTML = '<p class="muted">Loading photos…</p>';
    var mine = view, r = view.r;
    // the curated photos on the species page come first (unless a life stage is wanted), then the most-liked observations
    var first = r.stage ? Promise.resolve(null) : getJSON(API + 'taxa/' + t.id).catch(function () { return null; });
    first.then(function (d) {
      if (mine !== view) return;
      var tx = d && d.results && d.results[0];
      (tx && tx.taxon_photos || []).forEach(function (tp) { addPhoto(photoObj(tp.photo || {})); });
      return morePhotos();
    }).catch(offline);
  }
  function addPhoto(p) { if (p && !view.seen[p.id]) { view.seen[p.id] = 1; view.photos.push(p); } }
  function morePhotos() {
    var mine = view, r = view.r; view.page++;
    var u = API + 'observations?photos=true&quality_grade=research&order_by=votes&per_page=30&page=' + view.page +
      '&photo_license=' + Object.keys(OK).join(',') + '&taxon_id=' + view.taxon.id + (r.stage ? '&term_id=' + r.stage[0] + '&term_value_id=' + r.stage[1] : '');
    $('#more').innerHTML = '<span class="muted">Loading more…</span>';
    return getJSON(u).then(function (d) {
      if (mine !== view) return;
      (d.results || []).forEach(function (o) {
        var who = o.user ? (o.user.name || o.user.login) : '';
        (o.photos || []).slice(0, 2).forEach(function (p) { addPhoto(photoObj(p, { obs: o.id, who: who })); });
      });
      view.total = d.total_results || 0;
      renderPhotos();
    }).catch(function () { if (mine === view) { renderPhotos(); offline(); } });
  }
  function renderPhotos() {
    var g = $('#grid'); if (!g) return;
    g.innerHTML = view.photos.length ? view.photos.map(function (p, k) {
      return '<button class="ph" data-k="' + k + '" title="Use this photo"><img loading="lazy" alt="" src="' + esc(p.thumb) + '">' +
        '<span><b>' + esc(p.license) + '</b> · ' + esc(p.who || (p.attribution || '').replace(/^\(c\)\s*/i, '').split(',')[0]) + '</span></button>';
    }).join('') : '<p class="muted">No photos with a reusable licence were found for this match' + (view.r.stage ? ' at this life stage' : '') + '. Try another match above, another name, or upload your own picture.</p>';
    g.onclick = function (e) { var b = e.target.closest('.ph'); if (b) usePhoto(view.photos[+b.dataset.k]); };
    $('#more').innerHTML = view.photos.length && view.page * 30 < (view.total || 0) ? '<button id="b-more">Show more photos</button>' : '';
    if ($('#b-more')) $('#b-more').onclick = function () { morePhotos(); };
  }

  // ---------- 5. cut out and save ----------
  function usePhoto(p) {
    var r = view.r;
    toast('Opening the photo…');
    fetch(p.big, { mode: 'cors' }).then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.blob(); })
      .catch(function () { return fetch(p.thumb, { mode: 'cors' }).then(function (res) { if (!res.ok) throw new Error(); return res.blob(); }); })
      .then(function (blob) {
        var file = new File([blob], r.slug + '.jpg', { type: blob.type || 'image/jpeg' });
        return CUTOUT.open(file);
      })
      .then(function (out) {
        if (!out) return;
        save(r, out, { source: 'inaturalist', attribution: p.attribution, license: p.license, page: p.page, observation: p.obs, who: p.who,
          taxon: view.taxon ? view.taxon.name : '', taxonCommon: view.taxon ? view.taxon.preferred_common_name || '' : '' });
      })
      .catch(function () {
        $('#work').insertAdjacentHTML('afterbegin', '<div class="note">The browser would not let this page open that photo directly. ' +
          '<a target="_blank" rel="noopener" href="' + esc(p.page) + '">Open it on iNaturalist</a>, save the image to your computer, then press <b>Upload my own picture</b>. ' +
          'The photographer will still be credited.</div>');
        pendingCredit = { slug: r.slug, credit: { source: 'inaturalist', attribution: p.attribution, license: p.license, page: p.page, observation: p.obs, who: p.who, taxon: view.taxon ? view.taxon.name : '' } };
      });
  }
  var pendingCredit = null;
  $('#f-own').addEventListener('change', function () {
    var f = this.files[0], r = view.r; this.value = ''; if (!f) return;
    CUTOUT.open(f).then(function (out) {
      if (!out) return;
      var c = pendingCredit && pendingCredit.slug === r.slug ? pendingCredit.credit : { source: 'upload', attribution: '', license: '', page: '' };
      if (c.source === 'upload') { var who = prompt('Who took or made this picture? (for the credits page — leave blank if it is yours)', ''); c.attribution = who || ''; }
      pendingCredit = null; save(r, out, c);
    });
  });
  function save(r, out, credit) {
    clearIll(r.slug);
    savePick(r.slug, { status: 'done', url: out.url, aspect: out.aspect, credit: credit, name: r.name, sci: r.sci, at: Date.now() });
    toast('Saved ' + r.name + '.');
    step(1);
    if (items[cur] === r) { renderList(); renderWork(); }
  }

  // ---------- 6. download / open a .zip (stored, no compression: the pictures are already compressed) ----------
  var CRC = (function () { var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { var c = 0xffffffff; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  function utf8(s) { return new TextEncoder().encode(s); }
  function zip(files) {
    var parts = [], central = [], off = 0;
    files.forEach(function (f) {
      var name = utf8(f.name), data = f.data, crc = crc32(data);
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
      h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + data.length;
    });
    var csize = central.reduce(function (s, a) { return s + a.length; }, 0);
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
    return new Blob(parts.concat(central, [new Uint8Array(e.buffer)]), { type: 'application/zip' });
  }
  function unzip(buf) {
    var v = new DataView(buf), out = {}, i = 0;
    while (i + 30 <= buf.byteLength && v.getUint32(i, true) === 0x04034b50) {
      var method = v.getUint16(i + 8, true), size = v.getUint32(i + 18, true), nl = v.getUint16(i + 26, true), xl = v.getUint16(i + 28, true);
      var name = new TextDecoder().decode(new Uint8Array(buf, i + 30, nl)), start = i + 30 + nl + xl;
      if (method === 0) out[name] = new Uint8Array(buf, start, size);
      i = start + size;
    }
    return out;
  }
  function dataToBytes(u) { var b = atob(u.split(',')[1]), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function csvCell(s) { s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  $('#b-down').addEventListener('click', function () {
    var files = [], credits = [], rows = [['File', 'Name', 'Scientific name', 'Status', 'Source', 'Credit', 'Licence', 'Photo page', 'iNaturalist species']];
    var todo = items.filter(function (r) { return picks[r.slug]; });
    if (!todo.length) { toast('Nothing to download yet. Pick a photo first.'); return; }
    var btn = this; btn.disabled = true;
    var k = 0;
    (function next() {
      var r = todo[k++];
      if (!r) return finish();
      var p = picks[r.slug], c = p.credit || {}, file = '', photo = '';
      btn.textContent = 'Preparing ' + k + ' of ' + todo.length + '…';
      var work = p.status === 'done' ? final(r.slug).then(function (u) {
        var ext = function (x) { return x.indexOf('image/png') > 0 ? '.png' : '.webp'; };
        file = 'pictures/' + r.slug + ext(u); photo = 'photos/' + r.slug + ext(p.url);
        files.push({ name: file, data: dataToBytes(u) });
        files.push({ name: photo, data: dataToBytes(p.url) });
      }) : Promise.resolve();
      work.then(function () {
        credits.push({ slug: r.slug, name: r.name, sci: r.sci, status: p.status, file: file, photo: photo, aspect: p.aspect || null, credit: c });
        rows.push([file, r.name, r.sci, p.status === 'done' ? 'New picture' : 'Keep current', c.source || '', c.attribution || '', c.license || '', c.page || '', c.taxon || '']);
        setTimeout(next, 0);
      }, function () { setTimeout(next, 0); });
    })();
    function finish() {
      var n = files.length / 2;
      files.push({ name: 'credits.json', data: utf8(JSON.stringify({ made: new Date().toISOString(), style: STY, items: credits }, null, 1)) });
      files.push({ name: 'credits.csv', data: utf8('\ufeff' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n')) });
      var a = document.createElement('a'); a.href = URL.createObjectURL(zip(files)); a.download = 'ecobuild-pictures.zip';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      btn.disabled = false; btn.textContent = 'Download pictures';
      toast('Downloaded ' + n + ' pictures (' + (STY.style === 'illus' ? 'illustrations' : 'photos') + '), the original photos and the credits list.');
    }
  });
  $('#b-load').addEventListener('click', function () { $('#f-load').click(); });
  $('#f-load').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    f.arrayBuffer().then(function (buf) {
      var z = unzip(buf), meta = z['credits.json'];
      if (!meta) { toast('That is not a pictures file from this page.'); return; }
      var list = JSON.parse(new TextDecoder().decode(meta)).items || [], n = 0;
      list.forEach(function (it) {
        if (it.status === 'skip') { savePick(it.slug, { status: 'skip' }); n++; return; }
        var src = it.photo && z[it.photo] ? it.photo : it.file, bytes = src && z[src]; if (!bytes) return;
        var type = /\.png$/.test(src) ? 'image/png' : 'image/webp', s = '';
        for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        savePick(it.slug, { status: 'done', url: 'data:' + type + ';base64,' + btoa(s), aspect: it.aspect, credit: it.credit, name: it.name, sci: it.sci, at: Date.now() });
        n++;
      });
      illCache = {}; toast('Opened ' + n + ' saved items.'); renderList(); renderWork();
    }).catch(function () { toast('Could not open that file.'); });
  });

  // ---------- start ----------
  openDB().then(loadAll).then(function () {
    var last = null; try { last = localStorage.getItem('ecobuild-picker-cur'); } catch (e) {}
    var i = 0;
    items.forEach(function (r, k) { if (r.slug === last) i = k; });
    if (!last) for (var k = 0; k < items.length; k++) if (status(items[k]) === 'todo') { i = k; break; }
    show(i);
  });
  window.PICKER = { items: items, picks: picks };
})();
</script>
</body>
</html>
